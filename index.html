<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>여행 회화 (Travel Talk)</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="apple-touch-icon" href="icon.svg">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <header class="app-header">
        <h1>✈️ 여행 회화</h1>
        <div class="lang-toggle">
            <button id="btn-en" class="lang-btn active" onclick="setLanguage('en')">English</button>
            <button id="btn-jp" class="lang-btn" onclick="setLanguage('jp')">日本語</button>
        </div>
    </header>

    <!-- Search Bar -->
    <div class="search-container">
        <input type="search" id="search-input" class="search-input" placeholder="🔍 검색 (예: 화장실, 물, 가격, toilet)">
    </div>

    <nav class="category-nav">
        <ul id="category-list">
            <!-- Categories will be injected here by JS -->
        </ul>
    </nav>

    <main id="content-area">
        <!-- Phrase cards will be injected here -->
        <div class="empty-state">
            카테고리를 선택해주세요.
        </div>
    </main>

    <!-- Fullscreen Overlay -->
    <div id="overlay" class="overlay" onclick="if(event.target === this) closeOverlay()">
        <div class="overlay-ko" id="overlay-ko">한국어 의미</div>
        <div class="overlay-target" id="overlay-target">Target Text</div>
        <div class="overlay-pron" id="overlay-pron">Pronunciation</div>
        
        <div class="overlay-btn-group">
            <button class="action-btn btn-speak-big" onclick="replayAudio()">🔊</button>
            <button class="action-btn btn-close" onclick="closeOverlay()">✕</button>
        </div>
        <div class="helper-text">화면을 탭하면 닫힙니다</div>
    </div>

    <!-- Scripts -->
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
