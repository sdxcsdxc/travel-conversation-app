<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>여행 회화 (Travel Talk)</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="apple-touch-icon" href="icon.svg">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <header class="app-header">
        <h1>✈️ 여행 회화</h1>
        <div class="lang-toggle">
            <button id="btn-en" class="lang-btn" onclick="setLanguage('en')">English</button>
            <button id="btn-jp" class="lang-btn active" onclick="setLanguage('jp')">日本語</button>
        </div>
    </header>

    <!-- Search Bar -->
    <div class="search-container">
        <input type="search" id="search-input" class="search-input" placeholder="🔍 검색 (예: 화장실, 물, 가격, toilet)">
    </div>

    <nav class="category-nav">
        <ul id="category-list">
            <!-- Categories will be injected here by JS -->
        </ul>
    </nav>

    <main id="content-area">
        <!-- Phrase cards will be injected here -->
        <div class="empty-state">
            카테고리를 선택해주세요.
        </div>
    </main>

    <!-- Fullscreen Overlay -->
    <div id="overlay" class="overlay" onclick="if(event.target === this) closeOverlay()">
        <div class="overlay-ko" id="overlay-ko">한국어 의미</div>
        <div class="overlay-target" id="overlay-target">Target Text</div>
        <div class="overlay-pron" id="overlay-pron">Pronunciation</div>
        
        <div class="overlay-btn-group">
            <button class="action-btn btn-speak-big" onclick="replayAudio()">🔊</button>
            <button class="action-btn btn-close" onclick="closeOverlay()">✕</button>
        </div>
        <div class="helper-text">화면을 탭하면 닫힙니다</div>
    </div>

    <!-- Floating Action Button for Calculator -->
    <button id="fab-calc" class="fab" onclick="toggleCalculator()" aria-label="Open Calculator">
        🧮
    </button>

    <!-- Calculator Modal -->
    <div id="calc-modal" class="calc-modal">
        <div class="calc-header">
            <h3>🛍️ 면세 계산기</h3>
            <button class="btn-close-calc" onclick="toggleCalculator()">✕</button>
        </div>
        <div class="calc-body">
            <div class="input-group">
                <label>가격 (엔화 ¥)</label>
                <input type="number" id="calc-input" placeholder="0" inputmode="numeric">
            </div>
            
            <div class="calc-result-box">
                <div class="result-row">
                    <span>면세가 (10% OFF)</span>
                    <span id="res-taxfree">0 ¥</span>
                </div>
                <div class="result-row highlight">
                    <span>한국돈 (약)</span>
                    <span id="res-krw">0 원</span>
                </div>
            </div>
            
            <div id="tax-alert" class="tax-alert">
                면세 한도(5,500엔)까지 <br><strong>5,500엔</strong> 남았습니다!
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
